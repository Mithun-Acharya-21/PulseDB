# ============================================================
# FILE: .github/workflows/cd.yml
# PURPOSE: Continuous Delivery — runs ONLY on pushes to main.
#          Builds a Docker image and pushes it to Docker Hub.
# ============================================================

name: CD — Build & Push Docker Image

# TRIGGER: Only runs when code is merged/pushed to 'main'.
# Never runs on pull requests — we only deploy reviewed code.
on:
  push:
    branches: [main]

jobs:
  # -------------------------------------------------------
  # JOB: build-and-push-docker
  # Builds the Go backend into a Docker image and uploads
  # it to Docker Hub for deployment anywhere in the world.
  # -------------------------------------------------------
  build-and-push-docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # STEP 1: Log in to Docker Hub using secrets.
      # IMPORTANT: You must add these secrets in your GitHub repo settings:
      #   Settings → Secrets and variables → Actions → New repository secret
      #   - DOCKERHUB_USERNAME: your Docker Hub username
      #   - DOCKERHUB_TOKEN:    a Docker Hub Access Token (NOT your password)
      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # STEP 2: Set up Docker Buildx — an advanced builder that
      # supports multi-platform images (e.g., for ARM Macs + Linux servers)
      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # STEP 3: Extract metadata for the Docker image.
      # This automatically generates tags like:
      #   - yourusername/pulsedb:latest          (always updated on main)
      #   - yourusername/pulsedb:sha-a1b2c3d     (unique per commit)
      # Having the commit SHA tag means you can always rollback to
      # a previous version with 100% precision.
      - name: 🏷️ Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/pulsedb
          tags: |
            type=sha,prefix=sha-       # e.g., sha-abc1234
            type=raw,value=latest      # always tag as 'latest'

      # STEP 4: The main event — Build the Docker image from your
      # Dockerfile and push it to Docker Hub.
      # The 'cache-from' and 'cache-to' flags make subsequent builds
      # dramatically faster by reusing unchanged layers.
      - name: 🚀 Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .           # Build context is the root of the repo
          file: ./Dockerfile   # Use the existing multi-stage Dockerfile
          push: true           # Actually push (not just build locally)
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha   # Use GitHub Actions cache for layer caching
          cache-to: type=gha,mode=max
